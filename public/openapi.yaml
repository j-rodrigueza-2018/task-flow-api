openapi: 3.0.0
info:
  title: 'Task Flow API'
  description: 'API for managing tasks in the Task Flow application.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
    description: 'Local Development Server'
paths:
  '/api/private/tasks/{id}/users':
    post:
      tags:
        - Tasks
      summary: 'Add a user to a task.'
      description: 'Assigns a specific user to an existing task by their ID.'
      operationId: 29eea6eb50b0cebd5056e7f99d019a03
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - user_id
              properties:
                user_id:
                  description: 'ID of the user to add to the task.'
                  type: string
                  format: uuid
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              type: object
      responses:
        '201':
          description: 'User added to task successfully'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User added to task successfully.' }
                  data: { $ref: '#/components/schemas/TaskUser' }
                type: object
        '400':
          description: 'Bad request (e.g., missing user_id).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Field "user_id" is required.' }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
  /api/private/tasks:
    get:
      tags:
        - Tasks
      summary: 'Get user tasks.'
      description: 'Retrieve all tasks for a specific user.'
      operationId: 0d91a7150581169e4729a8a62dae8312
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User tasks retrieved successfully.' }
                  data: { type: array, items: { $ref: '#/components/schemas/Task' } }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Tasks
      summary: 'Create a new task.'
      description: 'Creates a new task and assigns it to a specific board.'
      operationId: 80628b6a1c4c8f9fdb1ae451699f3622
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - board_id
                - title
              properties:
                board_id:
                  description: 'ID of the board where the task will be created.'
                  type: string
                  format: uuid
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                title:
                  description: 'Title of the task.'
                  type: string
                  example: 'Configure database connection.'
                description:
                  description: 'Optional details for the task.'
                  type: string
                  example: 'Review the credentials in the .env file.'
                  nullable: true
              type: object
      responses:
        '201':
          description: 'Task created successfully'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Task created successfully.' }
                  data: { $ref: '#/components/schemas/Task' }
                type: object
        '400':
          description: 'Bad request or validation error'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The title cannot be empty.' }
                type: object
        '500':
          description: 'Internal server error'
      security:
        -
          bearerAuth: []
  '/api/private/tasks/{id}':
    get:
      tags:
        - Tasks
      summary: 'Get a specific task.'
      description: 'Retrieve details of a specific task by its ID.'
      operationId: 7a75b0a96953955d60300c3d27385604
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Task retrieved successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Task' }
                type: object
        '404':
          description: 'Task not found or invalid ID.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Task not found or unauthorized.' }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
components:
  schemas:
    Task:
      title: Task
      description: 'Represents a task in the system.'
      properties:
        id:
          description: 'The unique identifier of the task.'
          type: string
          format: uuid
          example: cfca3139-dfff-49bf-a1df-8baa8e392d01
        title:
          description: 'The title of the task.'
          type: string
          example: 'Implement user authentication'
        description:
          description: 'The description of the task.'
          type: string
          example: 'Implement user authentication using JWT tokens.'
          nullable: true
        status:
          description: 'The status of the task.'
          type: string
          example: in_progress
          enum:
            - pending
            - in_progress
            - completed
        board_id:
          description: 'The unique identifier of the board to which the task belongs.'
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        created_at:
          description: 'The timestamp when the task was created.'
          type: string
          format: date-time
          example: '2024-06-01T12:00:00Z'
        updated_at:
          description: 'The timestamp when the task was last updated.'
          type: string
          format: date-time
          example: '2024-06-02T15:30:00Z'
        deleted_at:
          description: 'The timestamp when the task was deleted, if applicable.'
          type: string
          format: date-time
          example: '2024-06-03T10:15:00Z'
          nullable: true
      type: object
    TaskUser:
      description: 'Represents the association between a task and a user.'
      properties:
        id:
          description: 'Unique identifier for the task-user association.'
          type: string
          format: uuid
          example: f3918a3d-5c74-4b92-8f1e-3a8c7b6d5e4f
        task_id:
          description: 'Unique identifier of the associated task.'
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        user_id:
          description: 'Unique identifier of the associated user.'
          type: string
          format: uuid
          example: b1c2d3e4-f5g6-7890-hijk-lm1234567890
        created_at:
          description: 'Timestamp when the association was created.'
          type: string
          format: date-time
          example: '2024-06-01T12:00:00Z'
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
tags:
  -
    name: Tasks
    description: Tasks
