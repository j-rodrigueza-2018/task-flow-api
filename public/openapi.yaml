openapi: 3.0.0
info:
  title: 'Task Flow API'
  description: 'API for managing tasks in the Task Flow application.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
    description: 'Local Development Server'
paths:
  '/api/private/boards/{id}/users':
    get:
      tags:
        - Boards
      summary: 'Get all users of a board.'
      description: 'Retrieves a list of all users belonging to a specific board. The requester must be a member of the board.'
      operationId: d34c0e36ced056af15004bf55eac28aa
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Board users retrieved successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Board users retrieved successfully.' }
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, board_id: { type: string, format: uuid }, user_id: { type: string, format: uuid }, role: { type: string, example: MEMBER }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }, type: object } }
                type: object
        '400':
          description: 'Bad request (e.g., empty board id).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The board_id cannot be empty.' }
                type: object
        '403':
          description: 'Permission denied.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Requester does not have permission to access this board.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An error occurred while retrieving board users.' }
                type: object
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Boards
      summary: 'Add a user to a board.'
      description: 'Assigns a user to a specific board with a given role. Requires ADMIN or OWNER privileges.'
      operationId: a8e5e434d48c80eaa7164d204b64717f
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - user_id
                - role
              properties:
                user_id:
                  description: 'The unique identifier of the user to add.'
                  type: string
                  format: uuid
                  example: b1c2d3e4-f5g6-7890-hijk-lm1234567890
                role:
                  description: 'The role to assign to the user on the board.'
                  type: string
                  example: MEMBER
                  enum: [owner, admin, member, viewer]
              type: object
      responses:
        '201':
          description: 'User added to board successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User added to board successfully.' }
                  data: { $ref: '#/components/schemas/BoardUser' }
                type: object
        '400':
          description: 'Bad request, missing fields, invalid role, or requester does not belong to the board.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Field "user_id" is required.' }
                type: object
        '409':
          description: 'Domain exception, such as the user already existing in the board or lacking permissions.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Requester does not have permission to add users to this board.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An unexpected error occurred while adding the user to the board.' }
                type: object
      security:
        -
          bearerAuth: []
  /api/private/boards:
    get:
      tags:
        - Boards
      summary: 'Get all boards for the authenticated user.'
      description: 'Retrieves a list of all boards the authenticated user belongs to.'
      operationId: 5281bd07f4503c8a8e6255ee0a4eef16
      responses:
        '200':
          description: 'User boards retrieved successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User boards retrieved successfully.' }
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, name: { type: string }, description: { type: string, nullable: true }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }, type: object } }
                type: object
        '400':
          description: 'Bad request.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The requester_id cannot be empty.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An error occurred while retrieving user boards.' }
                type: object
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Boards
      summary: 'Create a new board.'
      description: 'Creates a new board and assigns the requester as its owner.'
      operationId: 774634eed7ea6c0604e4157833157b9d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
              properties:
                name:
                  description: 'The name of the board.'
                  type: string
                  example: 'Project Management Board'
                description:
                  description: 'Optional details for the board.'
                  type: string
                  example: 'This board is used for managing project tasks and milestones.'
                  nullable: true
              type: object
      responses:
        '201':
          description: 'Board created successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Board created successfully.' }
                  data: { $ref: '#/components/schemas/Board' }
                type: object
        '400':
          description: 'Bad request or validation error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The name must be between 10 and 255 characters long.' }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
  '/api/private/boards/{id}':
    get:
      tags:
        - Boards
      summary: 'Get a specific board.'
      description: 'Retrieve the details of a specific board by its ID.'
      operationId: 0b9b2eec2624f926be922e56ed192552
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Board retrieved successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Board' }
                type: object
        '404':
          description: 'Board not found or access denied.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Board not found.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An error occurred while retrieving the board.' }
                type: object
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Boards
      summary: 'Delete a specific board.'
      description: 'Soft deletes a board. Requires OWNER privileges on the board.'
      operationId: ad8b3c795a98d485a48f3a5b84d4678f
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board to delete.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Board deleted successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Board deleted successfully.' }
                type: object
        '400':
          description: 'Bad request or permission denied.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Requester does not have permission to delete this board.' }
                type: object
        '409':
          description: 'Conflict, board is already deleted.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The board is already deleted.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An unexpected error occurred while deleting the board.' }
                type: object
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Boards
      summary: 'Update an existing board.'
      description: 'Updates the name and/or description of a specific board. The requester must be a member of the board.'
      operationId: e5d0336b80ce9f768290be0b6c3a10db
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'The new name of the board.'
                  type: string
                  example: 'Updated Project Board'
                description:
                  description: 'The new description of the board.'
                  type: string
                  example: 'Updated description with new milestones.'
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Board updated successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Board updated successfully.' }
                  data: { $ref: '#/components/schemas/Board' }
                type: object
        '400':
          description: 'Bad request or permission denied.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Board not found. / Requester does not have permission to update this board.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An error occurred while updating the board.' }
                type: object
      security:
        -
          bearerAuth: []
  '/api/private/boards/{id}/users/{user_id}':
    delete:
      tags:
        - Boards
      summary: 'Remove a user from a board.'
      description: 'Removes a user from a specific board. The requester must be an ADMIN or OWNER, or be removing themselves.'
      operationId: 19efacfa551e8224ae849fea33bb7813
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board.'
          required: true
          schema:
            type: string
            format: uuid
        -
          name: user_id
          in: path
          description: 'The unique identifier of the user to remove.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'User removed from the board successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User deleted from the board successfully.' }
                type: object
        '403':
          description: 'Permission denied.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Only owners and admins can remove other members from the board.' }
                type: object
        '404':
          description: 'Board, user, or membership not found.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The user is not a member of this board.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An unexpected error occurred while deleting the user from the board.' }
                type: object
      security:
        -
          bearerAuth: []
  '/api/private/boards/{id}/tasks':
    get:
      tags:
        - Boards
      summary: 'Get all tasks for a board.'
      description: 'Retrieves a list of all tasks belonging to a specific board. The requester must be a member of the board.'
      operationId: c7d2fe4d2953c958fa678b8da9b28dcf
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the board.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Board tasks retrieved successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Board tasks retrieved successfully.' }
                  data: { type: array, items: { properties: { id: { type: string, format: uuid }, title: { type: string }, description: { type: string, nullable: true }, status: { type: string }, board_id: { type: string, format: uuid }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }, type: object } }
                type: object
        '400':
          description: 'Bad request (e.g., empty board id).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The board_id cannot be empty.' }
                type: object
        '403':
          description: 'Permission denied.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Requester does not have permission to access this board.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An error occurred while retrieving board tasks.' }
                type: object
      security:
        -
          bearerAuth: []
  '/api/private/tasks/{id}/users':
    post:
      tags:
        - Tasks
      summary: 'Add a user to a task.'
      description: 'Assigns a specific user to an existing task by their ID.'
      operationId: 29eea6eb50b0cebd5056e7f99d019a03
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - user_id
              properties:
                user_id:
                  description: 'ID of the user to add to the task.'
                  type: string
                  format: uuid
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              type: object
      responses:
        '201':
          description: 'User added to task successfully'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User added to task successfully.' }
                  data: { $ref: '#/components/schemas/TaskUser' }
                type: object
        '400':
          description: 'Bad request (e.g., missing user_id).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Field "user_id" is required.' }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
  /api/private/tasks:
    get:
      tags:
        - Tasks
      summary: 'Get user tasks.'
      description: 'Retrieve all tasks for a specific user.'
      operationId: 0d91a7150581169e4729a8a62dae8312
      responses:
        '200':
          description: 'Successful response.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User tasks retrieved successfully.' }
                  data: { type: array, items: { $ref: '#/components/schemas/Task' } }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Tasks
      summary: 'Create a new task.'
      description: 'Creates a new task and assigns it to a specific board.'
      operationId: 80628b6a1c4c8f9fdb1ae451699f3622
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - board_id
                - title
              properties:
                board_id:
                  description: 'ID of the board where the task will be created.'
                  type: string
                  format: uuid
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                title:
                  description: 'Title of the task.'
                  type: string
                  example: 'Configure database connection.'
                description:
                  description: 'Optional details for the task.'
                  type: string
                  example: 'Review the credentials in the .env file.'
                  nullable: true
              type: object
      responses:
        '201':
          description: 'Task created successfully'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Task created successfully.' }
                  data: { $ref: '#/components/schemas/Task' }
                type: object
        '400':
          description: 'Bad request or validation error'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The title cannot be empty.' }
                type: object
        '500':
          description: 'Internal server error'
      security:
        -
          bearerAuth: []
  '/api/private/tasks/{id}':
    get:
      tags:
        - Tasks
      summary: 'Get a specific task.'
      description: 'Retrieve details of a specific task by its ID.'
      operationId: 7a75b0a96953955d60300c3d27385604
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Task retrieved successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  data: { $ref: '#/components/schemas/Task' }
                type: object
        '404':
          description: 'Task not found or invalid ID.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Task not found or unauthorized.' }
                type: object
        '500':
          description: 'Internal server error.'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Tasks
      summary: 'Delete a task.'
      description: 'Soft delete a specific task by its ID.'
      operationId: 14c3bf12a0c5baea510c33651036dcbc
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Task deleted successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Task deleted successfully.' }
                type: object
        '400':
          description: 'Bad request or validation error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The task is already deleted.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An unexpected error occurred while deleting the task.' }
                type: object
      security:
        -
          bearerAuth: []
    patch:
      tags:
        - Tasks
      summary: 'Update an existing task.'
      description: 'Update task properties such as title, description, status, or board assignment.'
      operationId: 923b00a03499a636342297aa498594af
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  description: 'The new title for the task.'
                  type: string
                  example: 'Updated task title.'
                description:
                  description: 'The new description for the task.'
                  type: string
                  example: 'Updated description details.'
                  nullable: true
                status:
                  description: 'The new status of the task.'
                  type: string
                  example: in_progress
                  enum: [pending, in_progress, completed]
                board_id:
                  description: 'The ID of the new board to move the task to.'
                  type: string
                  format: uuid
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              type: object
      responses:
        '200':
          description: 'Task updated successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'Task updated successfully.' }
                  data: { $ref: '#/components/schemas/Task' }
                type: object
        '400':
          description: 'Bad request or validation error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The title must be between 3 and 255 characters long.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An error occurred while updating the task.' }
                type: object
      security:
        -
          bearerAuth: []
  '/api/private/tasks/{id}/users/{user_id}':
    delete:
      tags:
        - Tasks
      summary: 'Remove a user from a task.'
      description: 'Removes the assignment of a specific user from a task.'
      operationId: ba4d20809a3fa72894c5b8ba5ce18300
      parameters:
        -
          name: id
          in: path
          description: 'The unique identifier of the task.'
          required: true
          schema:
            type: string
            format: uuid
        -
          name: user_id
          in: path
          description: 'The unique identifier of the user to remove.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'User removed from task successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User removed from the task successfully.' }
                type: object
        '400':
          description: 'Bad request or validation error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The user is not related to this task.' }
                type: object
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'An unexpected error occurred while deleting the user from the task.' }
                type: object
      security:
        -
          bearerAuth: []
  /api/login:
    post:
      tags:
        - Users
      summary: 'Authenticate user and get a JWT token.'
      description: 'Verifies the user credentials and returns a JWT token for accessing protected routes.'
      operationId: e81fcb9e05d466e2626c31fece753f2b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: SuperSecret123!
              type: object
      responses:
        '200':
          description: 'User logged in successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User logged in successfully.' }
                  token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
                type: object
        '401':
          description: 'Unauthorized (invalid credentials).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'Invalid email or password.' }
                type: object
  /api/users:
    post:
      tags:
        - Users
      summary: 'Register a new user.'
      description: 'Creates a new user account in the system.'
      operationId: f19592d13379613bbdd150fbeb61649f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - nickname
                - email
                - password
              properties:
                nickname:
                  description: 'The desired nickname (4-20 chars).'
                  type: string
                  example: johndoe
                email:
                  description: 'A valid email address.'
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  description: 'The user password (min 8 chars).'
                  type: string
                  format: password
                  example: SuperSecret123!
              type: object
      responses:
        '201':
          description: 'User registered successfully.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: 'User registered successfully.' }
                type: object
        '400':
          description: 'Validation error (e.g., short password or invalid email format).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'The password must be at least 8 characters long.' }
                type: object
        '409':
          description: 'Conflict error (e.g., email already registered).'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: error }
                  message: { type: string, example: 'A user with this email already exists.' }
